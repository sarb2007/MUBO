<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUBO</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div class="brand">

                <div class="logo">M</div>

                <div>
                    <h1>MUBO</h1>

                    <div class="status">
                        <span class="status-dot"></span>
                        Local AI · Online
                    </div>
                </div>

            </div>

            <button id="theme-button" class="theme-button" type="button">
                ◐
            </button>

        </header>


        <main id="chat">

            <div class="message ai">
                Hello! I'm MUBO, your local coding assistant.
            </div>

        </main>


        <form id="chat-form">

            <div class="input-wrapper">

                <input
                    id="message-input"
                    type="text"
                    placeholder="Ask MUBO anything..."
                    autocomplete="off"
                >

                <button type="submit">
                    ↑
                </button>

            </div>

        </form>

    </div>


    <script src="/app.js"></script>

</body>

</html>
