<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Coding Agent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>MUBO</h1>
            <p>Local AI coding assistant</p>
        </header>

        <main id="chat">
            <div class="message ai">
                Hello! I'm your local coding agent.
            </div>
        </main>

        <form id="chat-form">

            <input
                id="message-input"
                type="text"
                placeholder="Ask your coding agent..."
                autocomplete="off"
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
